<section class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-gray-950">Users and roles</h2>
    <p class="text-gray-500">Manage USER / ADMIN roles and active accounts.</p>
  </div>

  <ng-container *ngIf="message">
  <p class="rounded-md border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">{{ message }}</p>
  </ng-container>

  <div class="overflow-x-auto rounded-md border border-gray-200 bg-white">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50 text-left text-xs uppercase tracking-wide text-gray-500">
        <tr>
          <th class="px-4 py-3">Full name</th>
          <th class="px-4 py-3">Email</th>
          <th class="px-4 py-3">Role</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3">Created</th>
          <th class="px-4 py-3">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <ng-container *ngFor="let user of users">
        <tr>
          <td class="px-4 py-3 font-medium text-gray-950">{{ user.fullName }}</td>
          <td class="px-4 py-3">{{ user.email }}</td>
          <td class="px-4 py-3">
            <select [ngModel]="user.role" (ngModelChange)="updateRole(user, $event)" class="rounded-md border border-gray-300 p-2 text-xs">
              <ng-container *ngFor="let role of roles">
              <option [ngValue]="role">{{ role }}</option>
              </ng-container>
            </select>
          </td>
          <td class="px-4 py-3">
            <span class="rounded-full px-2 py-1 text-xs font-semibold" [class.bg-green-100]="user.active" [class.text-green-700]="user.active" [class.bg-red-100]="!user.active" [class.text-red-700]="!user.active">
              {{ user.active ? 'Active' : 'Disabled' }}
            </span>
          </td>
          <td class="px-4 py-3">{{ user.createdAt }}</td>
          <td class="px-4 py-3">
            <div class="flex gap-2">
              <button (click)="toggleActive(user)" class="rounded-md border border-gray-300 px-3 py-1 text-xs font-medium text-gray-700">
                {{ user.active ? 'Disable' : 'Enable' }}
              </button>
              <button (click)="deleteUser(user)" class="rounded-md border border-red-200 px-3 py-1 text-xs font-medium text-red-600">Delete</button>
            </div>
          </td>
        </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</section>
