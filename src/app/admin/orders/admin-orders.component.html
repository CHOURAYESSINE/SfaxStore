<section class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-gray-950">Orders</h2>
    <p class="text-gray-500">Consult orders, view customers and update delivery status.</p>
  </div>

  <div class="overflow-x-auto rounded-md border border-gray-200 bg-white">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50 text-left text-xs uppercase tracking-wide text-gray-500">
        <tr>
          <th class="px-4 py-3">Order</th>
          <th class="px-4 py-3">Customer</th>
          <th class="px-4 py-3">Date</th>
          <th class="px-4 py-3">Items</th>
          <th class="px-4 py-3">Total</th>
          <th class="px-4 py-3">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <ng-container *ngFor="let order of orders">
        <tr>
          <td class="px-4 py-3 font-medium text-gray-950">#{{ order.id }}</td>
          <td class="px-4 py-3">{{ order.user?.fullName }}</td>
          <td class="px-4 py-3">{{ order.createdAt }}</td>
          <td class="px-4 py-3">
            <ng-container *ngFor="let item of order.items">
            <p class="text-xs text-gray-600">{{ item.quantity }} x {{ item.product?.name }}</p>
            </ng-container>
          </td>
          <td class="px-4 py-3 font-semibold">{{ order.totalAmount | tndCurrency }}</td>
          <td class="px-4 py-3">
            <select
              [ngModel]="order.status"
              (ngModelChange)="updateStatus(order, $event)"
              class="rounded-md border border-gray-300 p-2 text-xs font-medium"
            >
              <ng-container *ngFor="let status of statuses">
              <option [ngValue]="status">{{ status }}</option>
              </ng-container>
            </select>
          </td>
        </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</section>
