<main class="min-h-screen bg-gray-50">
  <aside class="fixed inset-y-0 left-0 z-40 hidden w-64 border-r border-gray-200 bg-white lg:block">
    <div class="flex h-16 items-center border-b border-gray-200 px-6">
      <a routerLink="/admin/dashboard" class="text-xl font-bold text-gray-950">SfaxStore Admin</a>
    </div>
    <nav class="space-y-1 px-4 py-6">
      @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-yellow-50 text-yellow-700 border-yellow-400"
        class="block rounded-md border-l-4 border-transparent px-4 py-3 text-sm font-medium text-gray-600 hover:bg-gray-50"
      >
        {{ item.label }}
      </a>
      }
    </nav>
  </aside>

  <section class="lg:pl-64">
    <header class="sticky top-0 z-30 border-b border-gray-200 bg-white">
      <div class="flex min-h-16 flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-yellow-600">Back office</p>
          <h1 class="text-lg font-bold text-gray-950">Administration</h1>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <a routerLink="/" class="rounded-md border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700">
            Storefront
          </a>
          @if (authService.currentUser$ | async; as user) {
          <span class="rounded-md bg-gray-100 px-3 py-2 text-sm text-gray-700">
            {{ user.name }} · {{ user.role }}
          </span>
          }
          <button (click)="signOut()" class="rounded-md bg-gray-950 px-3 py-2 text-sm font-medium text-white">
            Sign out
          </button>
        </div>
      </div>
      <nav class="flex gap-1 overflow-x-auto border-t border-gray-100 px-4 py-2 lg:hidden">
        @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-yellow-400 text-white"
          class="whitespace-nowrap rounded-md px-3 py-2 text-sm font-medium text-gray-700"
        >
          {{ item.label }}
        </a>
        }
      </nav>
    </header>
    <div class="p-4 sm:p-6">
      <router-outlet />
    </div>
  </section>
</main>
