<main class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-block">
        <img src="/svg/logo.svg" alt="SfaxStore Logo" class="h-16 w-auto mx-auto" />
      </a>
      <h1 class="mt-4 text-2xl font-bold text-gray-900">Sign in to your account</h1>
      <p class="mt-2 text-sm text-gray-500">
        Or
        <a routerLink="/sign-up" class="font-medium text-yellow-500 hover:text-yellow-400">
          create a new account
        </a>
      </p>
    </div>

    <!-- Sign In Form -->
    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-8">
      <ng-container *ngIf="errorMessage">
      <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200">
        <p class="text-sm text-red-700">{{ errorMessage }}</p>
      </div>
      </ng-container>

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-900 mb-1">
            Email address
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 bg-gray-50"
            [class.border-red-500]="isFieldInvalid('email')"
            [class.border-gray-300]="!isFieldInvalid('email')"
            placeholder="Enter your email"
          />
          <ng-container *ngIf="isFieldInvalid('email')">
          <p class="mt-1 text-sm text-red-600">{{ getFieldError('email') }}</p>
          </ng-container>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-900 mb-1">
            Password
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 bg-gray-50 pr-10"
              [class.border-red-500]="isFieldInvalid('password')"
              [class.border-gray-300]="!isFieldInvalid('password')"
              placeholder="Enter your password"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600"
            >
              <ng-container *ngIf="showPassword; else elseBlock1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              </svg>
              </ng-container><ng-template #elseBlock1>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              </ng-template>
            </button>
          </div>
          <ng-container *ngIf="isFieldInvalid('password')">
          <p class="mt-1 text-sm text-red-600">{{ getFieldError('password') }}</p>
          </ng-container>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input
              type="checkbox"
              formControlName="rememberMe"
              class="w-4 h-4 text-yellow-400 border-gray-300 rounded focus:ring-yellow-400"
            />
            <span class="ml-2 text-sm text-gray-600">Remember me</span>
          </label>
          <a href="#" class="text-sm font-medium text-yellow-500 hover:text-yellow-400">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full flex items-center justify-center rounded-lg bg-yellow-400 px-5 py-2.5 text-sm font-medium text-white focus:outline-none focus:ring-4 focus:ring-yellow-200 disabled:bg-gray-300 disabled:cursor-not-allowed"
        >
          <ng-container *ngIf="isSubmitting; else elseBlock2">
          <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Signing in...
          </ng-container><ng-template #elseBlock2>
          Sign in
          </ng-template>
        </button>
      </form>
    </div>

    <!-- Back to Home -->
    <p class="text-center mt-6">
      <a routerLink="/" class="text-sm text-gray-500 hover:text-gray-700">
        ← Back to home
      </a>
    </p>
  </div>
</main>
